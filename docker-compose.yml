services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info --pool=${CELERY_POOL_TYPE} --concurrency=${CELERY_CONCURRENCY}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_POOL_TYPE=${CELERY_POOL_TYPE:-prefork}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy

